<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Preparing PDF for ChatGPT</title>
    <style>
      :root { color-scheme: dark light; font: 15px/1.5 system-ui, sans-serif; }
      body { display: grid; place-items: center; min-height: 100vh; margin: 0; background: Canvas; color: CanvasText; }
      main { padding: 28px; max-width: 350px; text-align: center; }
      .spinner { width: 30px; height: 30px; margin: 0 auto 24px; border: 3px solid color-mix(in srgb, CanvasText 20%, transparent);
        border-top-color: CanvasText; border-radius: 50%; animation: spin 900ms linear infinite; }
      h1 { font-size: 18px; font-weight: 600; margin: 0 0 10px; }
      p { margin: 0; opacity: .75; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
    </style>
  </head>
  <body>
    <main role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <h1>Preparing your PDF…</h1>
      <p>Opening ChatGPT and getting the attachment ready. Large files may take a moment.</p>
    </main>
  </body>
</html>
