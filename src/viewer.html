<!doctype html>
<html lang="en" class="minimap-preparing">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDF Viewer</title>
    <link rel="icon" type="image/png" href="assets/luna-mark.png" />
    <link rel="stylesheet" href="viewer/viewer.css" />
    <link rel="stylesheet" href="viewer/selection/text-selection.css" />
    <link rel="stylesheet" href="viewer/search/search-highlight-cues.css" />
    <link rel="stylesheet" href="viewer/navigation/toolbar-layout.css" />
    <link rel="stylesheet" href="viewer/navigation/minimap.css" />
    <link rel="stylesheet" href="viewer/theme/image-color-toggle.css" />
    <link rel="stylesheet" href="viewer/sharing/qr-file-url.css" />
    <link rel="stylesheet" href="viewer/annotation-layer.css" />
  </head>
  <body>
    <header class="toolbar" aria-label="PDF controls">
      <div id="section-nav" class="section-nav" hidden>
        <button
          id="section-toggle"
          class="mark-button section-toggle"
          type="button"
          aria-label="Document sections"
          aria-controls="section-popover"
          aria-expanded="false"
          title="Document sections"
        >§</button>
        <div id="section-popover" class="section-popover" hidden>
          <div id="section-document-title" class="section-document-title" hidden></div>
          <div class="section-popover-title">Sections</div>
          <nav id="section-list" class="section-list" aria-label="Document sections"></nav>
          <section id="section-metadata" class="section-metadata" hidden>
            <div class="section-metadata-title">Metadata</div>
            <dl id="section-metadata-list" class="section-metadata-list"></dl>
          </section>
        </div>
      </div>
      <button id="previous-page" class="icon-button" type="button" aria-label="Previous page" title="Previous page">
        <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m15 18-6-6 6-6" />
        </svg>
      </button>
      <label class="page-control" aria-label="Current page">
        <input id="page-number" type="text" value="1" inputmode="numeric" pattern="[0-9]*" />
        <span>/ <span id="page-count">—</span></span>
      </label>
      <button id="next-page" class="icon-button" type="button" aria-label="Next page" title="Next page">
        <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m9 18 6-6-6-6" />
        </svg>
      </button>
      <div class="search-tools">
        <button id="copy-file-url" class="mark-button" type="button" aria-label="Copy file URL" title="Copy file URL">
          <img src="assets/pinkie-mirror.png" alt="" aria-hidden="true" />
      </button>
        <div class="search-control" role="search" aria-label="Search PDF">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input
            id="search-input"
            type="search"
            autocomplete="off"
            spellcheck="false"
            placeholder="Search"
            aria-label="Search document"
          />
          <span id="search-count" class="search-count" aria-live="polite"></span>
          <button id="search-first" class="search-nav-button" type="button" aria-label="First search result" title="First result" disabled>⇈</button>
          <button id="search-previous" class="search-nav-button" type="button" aria-label="Previous search result" title="Previous result" disabled>↑</button>
          <button id="search-next" class="search-nav-button" type="button" aria-label="Next search result" title="Next result" disabled>↓</button>
        </div>
      </div>
      <div class="search-actions" role="group" aria-label="Document actions">
        <button id="summarize-chatgpt" class="mark-button" type="button" aria-label="Summarize with ChatGPT" title="Summarize with ChatGPT">
          <img src="assets/sweetie-bot.png" alt="" aria-hidden="true" />
        </button>
        <button id="download-pdf" class="mark-button" type="button" aria-label="Download PDF" title="Download PDF">
          <img src="assets/download-icon.png" alt="" aria-hidden="true" />
        </button>
      </div>
      <div class="spacer"></div>
      <button id="theme-toggle" class="mark-button theme-button" type="button" aria-label="Switch theme" title="Switch theme">
        <img id="theme-icon" alt="" aria-hidden="true" />
      </button>
      <button id="share-page" class="mark-button" type="button" aria-label="Copy page link" title="Copy page link">
        <img id="share-icon" alt="" aria-hidden="true" />
      </button>
      <div id="tools" class="tools">
        <button id="tools-button" class="mark-button tools-toggle" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="tools-menu" aria-label="More PDF tools" title="More PDF tools">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <circle cx="5" cy="12" r="1.8" />
            <circle cx="12" cy="12" r="1.8" />
            <circle cx="19" cy="12" r="1.8" />
          </svg>
        </button>
        <div id="tools-menu" class="tools-menu" role="menu" hidden>
          <button id="rotate-left" class="tool-button" type="button" role="menuitem">↶ <span>Rotate left</span></button>
          <button id="rotate-right" class="tool-button" type="button" role="menuitem">↷ <span>Rotate right</span></button>
          <div class="menu-separator" role="separator"></div>
          <button id="print-pdf" class="tool-button" type="button" role="menuitem">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M7 8V3h10v5" />
              <rect x="5" y="14" width="14" height="7" rx="1" />
              <path d="M5 17H3a1 1 0 01-1-1v-5a3 3 0 013-3h14a3 3 0 013 3v5a1 1 0 01-1 1h-2" />
              <path d="M17 12h.01" />
            </svg>
            <span>Print</span>
          </button>
          <button id="qr-file-url" class="tool-button" type="button" role="menuitem">▦ <span>QR file URL</span></button>
          <div class="menu-separator" role="separator"></div>
          <label class="tool-toggle" title="Use the document minimap instead of the browser scrollbar">
            <span>Show minimap</span>
            <input id="show-minimap" class="checkbox-input" type="checkbox" checked />
          </label>
          <label class="tool-toggle" title="Keep embedded PDF images in their original colors in dark mode">
            <span>Preserve image colors</span>
            <input id="preserve-image-colors" class="toggle-input" type="checkbox" checked />
            <span class="toggle-switch" aria-hidden="true"></span>
          </label>
        </div>
      </div>
    </header>

    <main id="viewer" class="viewer" aria-live="polite">
      <div id="status" class="status">Loading PDF…</div>
    </main>

    <aside
      id="minimap"
      class="minimap"
      role="scrollbar"
      aria-label="Document minimap"
      aria-controls="viewer"
      aria-orientation="vertical"
      aria-valuemin="0"
      aria-valuemax="0"
      aria-valuenow="0"
      tabindex="0"
    >
      <div id="minimap-pages" class="minimap-pages" aria-hidden="true"></div>
      <div id="minimap-viewport" class="minimap-viewport" aria-hidden="true"></div>
    </aside>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <dialog id="qr-file-url-dialog" class="qr-file-url-dialog" aria-labelledby="qr-file-url-title">
      <div class="qr-file-url-card">
        <button id="qr-file-url-close" class="qr-file-url-close" type="button" aria-label="Close QR code">×</button>
        <h2 id="qr-file-url-title">Scan file URL</h2>
        <p class="qr-file-url-help">Open this PDF on your phone</p>
        <div id="qr-file-url-graphic" class="qr-file-url-graphic" aria-label="QR code for this PDF"></div>
        <p id="qr-file-url-text" class="qr-file-url-text"></p>
      </div>
    </dialog>

    <script src="viewer/navigation/toolbar-layout.js"></script>
    <script src="viewer/network-fallback.js"></script>
    <script type="module" src="viewer/theme/image-color-toggle.js"></script>
    <script type="module" src="viewer/document-identity.js"></script>
    <script type="module" src="viewer/viewer.js"></script>
    <script type="module" src="viewer/navigation/rapid-page-navigation.js"></script>
    <script type="module" src="viewer/selection/text-selection.js"></script>
    <script type="module" src="viewer/search/search-highlight-cues.js"></script>
    <script type="module" src="viewer/navigation/minimap.js"></script>
    <script type="module" src="viewer/navigation/page-number-input.js"></script>
    <script type="module" src="viewer/sharing/copy-file-url.js"></script>
    <script type="module" src="viewer/sharing/summarize-with-chatgpt.js"></script>
    <script type="module" src="viewer/sharing/qr-file-url.js"></script>
    <script type="module" src="viewer/viewer-settings.js"></script>
    <script type="module" src="viewer/initial-zoom.js"></script>
    <script type="module" src="viewer/close-tab-shortcut.js"></script>
  </body>
</html>
